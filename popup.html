<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Speed Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <p class="eyebrow">YouTube Speed Control</p>
    <h1>Barra de velocidade</h1>
    <p class="description">
      Arraste a barra como um controle de volume para definir a velocidade que a extensao deve manter
      nos videos do YouTube, agora com alcance de ate 3.0x.
    </p>

    <section class="slider-card" aria-labelledby="sliderTitle">
      <div class="card-header">
        <div class="card-copy">
          <p class="card-label" id="sliderTitle">Seletor continuo</p>
          <p class="card-detail" id="speedDetail"></p>
        </div>
        <button type="button" class="toggle-button" id="toggleControl">Desligar controle</button>
      </div>

      <p class="current-speed" id="speedValue">1.5x</p>

      <label class="sr-only" for="speedRange">Velocidade de reproducao</label>
      <input
        class="speed-range"
        id="speedRange"
        type="range"
        min="1"
        max="3"
        step="0.25"
        value="1.5"
      >

      <div class="speed-points" id="speedPoints" aria-label="Pontos de velocidade"></div>
    </section>

    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
